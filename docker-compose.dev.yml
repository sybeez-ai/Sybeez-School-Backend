services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sybeez
      POSTGRES_PASSWORD: sybeez
      POSTGRES_DB: sybeez_school
    ports:
      - "5432:5432"
    volumes:
      - sybeez_pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sybeez:sybeez@postgres:5432/sybeez_school
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/app

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      - ./apps/ai:/app

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./apps/worker:/app

volumes:
  sybeez_pg:
