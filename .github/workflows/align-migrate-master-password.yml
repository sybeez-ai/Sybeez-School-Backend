name: Align migrate master password

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  align:
    name: Align migrate password
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Match the migrate secret and the RDS master password
        run: python3 .github/scripts/align_migrate_master_password.py
